# Transaction Aggregator Configuration
#
# Author: Athenkosi Mvimbi
#
# Defines application, database, Flyway, management, and startup
# synchronisation settings for the Transaction Aggregator API.
# 
spring:
  application:
    name: transaction-aggregator
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/aggregator?useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:aggregator}
    password: ${DB_PASSWORD:aggregator}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # Flyway owns the schema, Hibernate never touches it
  flyway:
    enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  # Pulls the last 6 months from every mock source when the app starts,
  # so the UI has data to show straight away.
  sync-on-startup: ${SYNC_ON_STARTUP:true}
